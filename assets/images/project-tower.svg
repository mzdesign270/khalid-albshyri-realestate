<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05150F"/>
      <stop offset="50%" stop-color="#0E2C1E"/>
      <stop offset="100%" stop-color="#194732"/>
    </linearGradient>
    <linearGradient id="towerGold" x1="0" y1="100" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8D08A"/>
      <stop offset="40%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#5C4515"/>
    </linearGradient>
    <linearGradient id="glassFacet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D5A47" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0D2418" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky & Sea Atmosphere -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>
  
  <!-- Red Sea Coastline Waves -->
  <path d="M0,520 Q200,500 400,530 T800,510 L800,600 L0,600 Z" fill="#06120D"/>
  <path d="M0,540 Q250,525 500,550 T800,535 L800,600 L0,600 Z" fill="#040C09" opacity="0.8"/>
  <line x1="0" y1="520" x2="800" y2="520" stroke="#C9A24B" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Distant Jeddah Skyline Silhouettes -->
  <rect x="50" y="420" width="45" height="100" fill="#0B2016" opacity="0.6"/>
  <rect x="110" y="380" width="60" height="140" fill="#0E261B" opacity="0.5"/>
  <rect x="620" y="390" width="50" height="130" fill="#0E261B" opacity="0.5"/>
  <rect x="685" y="430" width="70" height="90" fill="#0B2016" opacity="0.6"/>

  <!-- Main Luxury Tower: "برج اللؤلؤة" Pearl Tower -->
  <!-- Left Wing -->
  <polygon points="260,520 340,140 380,110 380,520" fill="url(#glassFacet)" stroke="url(#towerGold)" stroke-width="1.5"/>
  <!-- Right Wing -->
  <polygon points="380,110 420,140 500,520 380,520" fill="#133626" stroke="url(#towerGold)" stroke-width="1.5"/>
  
  <!-- Spire & Crown Lighting -->
  <line x1="380" y1="110" x2="380" y2="40" stroke="#E8D08A" stroke-width="3" filter="url(#glow)"/>
  <circle cx="380" cy="38" r="4" fill="#FFF" filter="url(#glow)"/>
  <polygon points="370,110 380,70 390,110" fill="url(#towerGold)"/>

  <!-- Architectural Floor Bands & Balconies -->
  <g stroke="#E8D08A" stroke-width="0.75" opacity="0.65">
    <line x1="335" y1="170" x2="425" y2="170"/>
    <line x1="330" y1="200" x2="430" y2="200"/>
    <line x1="325" y1="230" x2="435" y2="230"/>
    <line x1="320" y1="260" x2="440" y2="260"/>
    <line x1="315" y1="290" x2="445" y2="290"/>
    <line x1="310" y1="320" x2="450" y2="320"/>
    <line x1="305" y1="350" x2="455" y2="350"/>
    <line x1="300" y1="380" x2="460" y2="380"/>
    <line x1="295" y1="410" x2="465" y2="410"/>
    <line x1="290" y1="440" x2="470" y2="440"/>
    <line x1="285" y1="470" x2="475" y2="470"/>
    <line x1="280" y1="500" x2="480" y2="500"/>
  </g>

  <!-- Glowing Luxury Penthouse Windows (Random illuminated luxury suites) -->
  <g fill="#F3E5AB" opacity="0.85">
    <rect x="350" y="175" width="8" height="6" rx="1"/>
    <rect x="395" y="175" width="10" height="6" rx="1"/>
    <rect x="345" y="205" width="14" height="6" rx="1"/>
    <rect x="400" y="235" width="16" height="6" rx="1"/>
    <rect x="360" y="295" width="12" height="6" rx="1"/>
    <rect x="410" y="325" width="20" height="6" rx="1"/>
    <rect x="330" y="355" width="16" height="6" rx="1"/>
    <rect x="420" y="385" width="18" height="6" rx="1"/>
    <rect x="340" y="445" width="22" height="6" rx="1"/>
    <rect x="430" y="475" width="20" height="6" rx="1"/>
  </g>

  <!-- Podium Entrance & Water Feature -->
  <polygon points="220,520 540,520 560,560 200,560" fill="#0B1C14" stroke="#C9A24B" stroke-width="1.5"/>
  <rect x="340" y="525" width="80" height="30" rx="4" fill="#163C2A" stroke="#E8D08A" stroke-width="1"/>
  <text x="380" y="545" fill="#E8D08A" font-size="12" font-family="'Tajawal', sans-serif" font-weight="bold" text-anchor="middle">PEARL TOWER</text>

  <!-- Floating Luxury Tag -->
  <g transform="translate(60, 60)">
    <rect width="210" height="60" rx="12" fill="#07110D" fill-opacity="0.85" stroke="#C9A24B" stroke-width="1"/>
    <text x="15" y="26" fill="#A0AEC0" font-family="'Tajawal', sans-serif" font-size="12">مشروع تمليك حصري</text>
    <text x="15" y="48" fill="#E8D08A" font-family="'Tajawal', sans-serif" font-size="18" font-weight="bold">برج اللؤلؤة - جدة</text>
  </g>
</svg>
