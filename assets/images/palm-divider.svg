<svg xmlns="http://www.w3.org/2000/svg" width="220" height="40" viewBox="0 0 220 40" fill="none">
  <defs>
    <linearGradient id="goldDiv" x1="0" y1="20" x2="220" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity="0"/>
      <stop offset="30%" stop-color="#C9A24B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F3E5AB" stop-opacity="1"/>
      <stop offset="70%" stop-color="#C9A24B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Left flourish line -->
  <line x1="10" y1="20" x2="85" y2="20" stroke="url(#goldDiv)" stroke-width="1"/>
  <circle cx="85" cy="20" r="2" fill="#E8D08A"/>
  
  <!-- Center Palm Motif -->
  <g transform="translate(110, 20)">
    <!-- Palm Trunk -->
    <path d="M0,8 L0,-2" stroke="#C9A24B" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Palm Fronds -->
    <path d="M0,-2 C-3,-6 -8,-6 -12,-4" stroke="#E8D08A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M0,-2 C3,-6 8,-6 12,-4" stroke="#E8D08A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M0,-2 C-4,-9 -9,-11 -14,-9" stroke="#E8D08A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M0,-2 C4,-9 9,-11 14,-9" stroke="#E8D08A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M0,-2 C-2,-12 -5,-14 0,-15" stroke="#E8D08A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M0,-2 C2,-12 5,-14 0,-15" stroke="#E8D08A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <!-- Subtle crossed swords curve beneath -->
    <path d="M-8,12 Q0,6 8,12" stroke="#C9A24B" stroke-width="1" stroke-linecap="round" fill="none"/>
    <path d="M-8,14 Q0,8 8,14" stroke="#C9A24B" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="0" cy="9" r="1.5" fill="#F3E5AB"/>
  </g>

  <!-- Right flourish line -->
  <circle cx="135" cy="20" r="2" fill="#E8D08A"/>
  <line x1="135" y1="20" x2="210" y2="20" stroke="url(#goldDiv)" stroke-width="1"/>
</svg>
